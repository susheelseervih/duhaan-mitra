<style>
/* src/styles.css */
:root {
  --navy:#0F3D5C;
  --navy-dark:#0A2B41;
  --saffron:#FF9933;
  --saffron-dark:#E67E00;
  --green:#128807;
  --teal:#1E88A8;
  --purple:#7A3E9D;
  --red:#D64545;
  --cream:#FCFAF5;
  --ink:#16232B;
  --ink-soft:#54626B;
  --line:#E4E0D6;
  --white:#FFFFFF;
  --radius-sm:10px;
  --radius-md:18px;
  --radius-lg:28px;
  --shadow:0 20px 50px rgba(15,61,92,0.12);
  --maxw:1180px;
  --header-bg:rgba(252,250,245,0.9);
  --heading-text:#0A2B41;
}
html[data-theme=dark] {
  --cream:#0B1B26;
  --white:#142E3D;
  --ink:#EAF1F5;
  --ink-soft:#93A8B8;
  --line:#24404F;
  --navy:#7FC3EA;
  --saffron-dark:#FFAD52;
  --green:#3DDC7A;
  --red:#FF6B6B;
  --shadow:0 20px 50px rgba(0,0,0,0.5);
  --header-bg:rgba(11,27,38,0.9);
  --heading-text:#F2F7FA;
}
html[data-theme=dark] body {
  background: var(--cream);
}
html[data-theme=dark] .hero-eyebrow,
html[data-theme=dark] .kicker {
  filter: brightness(1.15);
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
body {
  margin: 0;
  font-family: "Inter", sans-serif;
  color: var(--ink);
  background: var(--cream);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1,
h2,
h3,
h4 {
  font-family: "Baloo 2", sans-serif;
  margin: 0;
  color: var(--heading-text);
  line-height: 1.12;
  font-weight: 700;
}
p {
  margin: 0;
}
a {
  text-decoration: none;
  color: inherit;
}
ul {
  list-style: none;
  margin: 0;
  padding: 0;
}
img,
svg {
  display: block;
  max-width: 100%;
}
button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
}
.wrap {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 24px;
}
:focus-visible {
  outline: 3px solid var(--saffron);
  outline-offset: 2px;
}
@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}
.awning {
  height: 8px;
  background:
    repeating-linear-gradient(
      90deg,
      var(--saffron) 0px,
      var(--saffron) 30px,
      #ffffff 30px,
      #ffffff 60px,
      var(--navy) 60px,
      var(--navy) 90px,
      #ffffff 90px,
      #ffffff 120px);
  background-size: 120px 100%;
}
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--header-bg);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: "Baloo 2";
  font-weight: 800;
  font-size: 1.3rem;
  color: var(--heading-text);
}
.brand .dot {
  color: var(--saffron);
}
.nav-links {
  display: flex;
  gap: 30px;
  align-items: center;
}
.nav-links a {
  font-weight: 600;
  font-size: 0.92rem;
  color: var(--ink-soft);
}
.nav-links a:hover {
  color: var(--navy);
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 26px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.94rem;
  transition: transform .15s ease, box-shadow .15s ease;
  white-space: nowrap;
}
.btn:active {
  transform: scale(0.97);
}
.btn-primary {
  background: var(--saffron);
  color: var(--heading-text);
}
.btn-primary:hover {
  background: var(--saffron-dark);
  box-shadow: 0 10px 24px rgba(230, 126, 0, 0.32);
}
.btn-outline {
  background: transparent;
  color: var(--navy);
  border: 2px solid var(--navy);
}
.btn-outline:hover {
  background: var(--navy);
  color: var(--white);
}
.btn-ghost-dark {
  background: var(--navy-dark);
  color: var(--white);
}
.btn-ghost-dark:hover {
  background: var(--navy);
}
.btn-sm {
  padding: 10px 18px;
  font-size: 0.85rem;
}
.menu-toggle {
  display: none;
  background: none;
  border: none;
  padding: 8px;
}
.menu-toggle svg {
  width: 24px;
  height: 24px;
  stroke: var(--navy-dark);
}
@media (max-width: 900px) {
  .nav-links {
    position: fixed;
    top: 64px;
    left: 0;
    right: 0;
    background: var(--white);
    flex-direction: column;
    padding: 20px 24px;
    gap: 16px;
    border-bottom: 1px solid var(--line);
    transform: translateY(-150%);
    transition: transform .25s ease;
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
  }
  .nav-links.open {
    transform: translateY(0);
  }
  .menu-toggle {
    display: block;
  }
  .nav-links .btn-outline {
    display: none;
  }
}
.hero {
  padding: 60px 0 0;
  position: relative;
  overflow: hidden;
}
.hero-grid {
  display: grid;
  grid-template-columns: 1fr 0.92fr;
  gap: 40px;
  align-items: center;
  padding-bottom: 36px;
}
.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #E9F1F7;
  color: var(--navy);
  padding: 8px 16px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.82rem;
  margin-bottom: 22px;
}
.hero h1 {
  font-size: clamp(2.3rem, 4.4vw, 3.5rem);
  max-width: 600px;
}
.hero h1 em {
  font-style: normal;
  color: var(--saffron-dark);
}
.hero p.sub {
  margin-top: 18px;
  font-size: 1.15rem;
  color: var(--ink-soft);
  max-width: 480px;
}
.hero-actions {
  display: flex;
  gap: 14px;
  margin-top: 30px;
  flex-wrap: wrap;
}
.trust-row {
  display: flex;
  align-items: center;
  gap: 22px;
  margin-top: 34px;
  flex-wrap: wrap;
}
.trust-row .badge {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
  color: var(--ink-soft);
  font-weight: 600;
}
.trust-row svg {
  width: 16px;
  height: 16px;
  stroke: var(--green);
}
.hero-visual {
  position: relative;
}
.phone-mock {
  background: var(--navy-dark);
  border-radius: 34px;
  padding: 12px;
  box-shadow: 0 40px 80px rgba(10, 43, 65, 0.35);
  max-width: 300px;
  margin: 0 auto;
}
.phone-screen {
  background: var(--white);
  border-radius: 24px;
  overflow: hidden;
}
.phone-notch {
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.phone-notch::before {
  content: "";
  width: 60px;
  height: 6px;
  background: var(--navy-dark);
  border-radius: 4px;
}
.phone-content {
  padding: 18px;
}
.phone-app-name {
  font-family: "Baloo 2";
  font-weight: 800;
  font-size: 0.95rem;
  color: var(--heading-text);
  margin-bottom: 14px;
}
.phone-app-name span {
  color: var(--saffron);
}
.otp-mock-label {
  font-size: 0.72rem;
  color: var(--ink-soft);
  margin-bottom: 6px;
}
.otp-mock-row {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
}
.otp-mock-box {
  flex: 1;
  height: 38px;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Baloo 2";
  font-weight: 700;
  color: var(--heading-text);
  background: var(--cream);
}
.phone-map {
  height: 110px;
  border-radius: 14px;
  background:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(
      90deg,
      var(--line) 1px,
      transparent 1px),
    #EAF2E9;
  background-size: 16px 16px;
  position: relative;
  margin-bottom: 14px;
  overflow: hidden;
}
.phone-pin {
  position: absolute;
  width: 18px;
  height: 18px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
}
.phone-pin.a {
  background: var(--navy);
  top: 60%;
  left: 28%;
}
.phone-pin.b {
  background: var(--saffron);
  top: 28%;
  left: 62%;
}
.phone-job-card {
  display: flex;
  gap: 10px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
}
.phone-job-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: #FFF3E4;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.phone-job-icon svg {
  width: 16px;
  height: 16px;
  stroke: var(--saffron);
}
.phone-job-title {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--heading-text);
}
.phone-job-sub {
  font-size: 0.68rem;
  color: var(--ink-soft);
}
.float-chip {
  position: absolute;
  background: var(--white);
  border-radius: 14px;
  padding: 10px 14px;
  box-shadow: 0 14px 30px rgba(0, 0, 0, 0.14);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--heading-text);
}
.float-chip svg {
  width: 16px;
  height: 16px;
  stroke: var(--green);
}
.float-chip.one {
  top: 6%;
  left: -8%;
}
.float-chip.two {
  bottom: 10%;
  right: -10%;
}
@media (max-width: 900px) {
  .hero-grid {
    grid-template-columns: 1fr;
  }
  .hero-visual {
    order: -1;
  }
  .float-chip {
    display: none;
  }
}
section {
  padding: 76px 0;
}
.section-head {
  max-width: 620px;
  margin: 0 auto 44px;
  text-align: center;
}
.section-head.left {
  margin: 0 0 40px;
  text-align: left;
}
.section-head .kicker {
  color: var(--green);
  font-weight: 700;
  font-size: 0.85rem;
  margin-bottom: 10px;
  display: block;
}
.section-head h2 {
  font-size: clamp(1.7rem, 3vw, 2.3rem);
}
.section-head p {
  margin-top: 12px;
  color: var(--ink-soft);
  font-size: 1.05rem;
}
.bg-alt {
  background: var(--white);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.bg-dark {
  background: var(--navy-dark);
  color: var(--white);
}
.bg-dark h2,
.bg-dark h3,
.bg-dark h4 {
  color: var(--white);
}
.speed-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
}
.speed-col {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 30px;
}
.speed-col-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 26px;
  gap: 14px;
  flex-wrap: wrap;
}
.speed-col-head h3 {
  font-size: 1.15rem;
}
.speed-time {
  font-family: "Baloo 2";
  font-weight: 800;
  font-size: 1.5rem;
  color: var(--saffron-dark);
  white-space: nowrap;
}
.speed-time span {
  display: block;
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--ink-soft);
  font-family: "Inter";
}
.timeline {
  position: relative;
  padding-left: 30px;
}
.timeline::before {
  content: "";
  position: absolute;
  left: 9px;
  top: 6px;
  bottom: 6px;
  width: 2px;
  background: var(--line);
}
.t-step {
  position: relative;
  padding-bottom: 22px;
}
.t-step:last-child {
  padding-bottom: 0;
}
.t-dot {
  position: absolute;
  left: -30px;
  top: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--navy);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  font-weight: 700;
  border: 3px solid var(--white);
  box-shadow: 0 0 0 1.5px var(--line);
}
.t-step:last-child .t-dot {
  background: var(--green);
}
.t-title {
  font-weight: 700;
  font-size: 0.92rem;
  color: var(--heading-text);
}
.t-desc {
  font-size: 0.83rem;
  color: var(--ink-soft);
  margin-top: 2px;
}
.t-mark {
  font-size: 0.7rem;
  color: var(--saffron-dark);
  font-weight: 700;
  margin-top: 3px;
}
@media (max-width: 800px) {
  .speed-wrap {
    grid-template-columns: 1fr;
  }
}
.feature-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
.feature-card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 26px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.feature-icon {
  width: 46px;
  height: 46px;
  border-radius: 12px;
  background: var(--fi-bg,#FFF3E4);
  display: flex;
  align-items: center;
  justify-content: center;
}
.feature-icon svg {
  width: 22px;
  height: 22px;
  stroke: var(--fi-color,var(--saffron));
}
.feature-card h4 {
  font-size: 1.05rem;
}
.feature-card p {
  font-size: 0.9rem;
  color: var(--ink-soft);
}
.mini-mock {
  border-radius: 12px;
  background: var(--cream);
  border: 1px solid var(--line);
  padding: 14px;
  margin-top: auto;
}
@media (max-width: 900px) {
  .feature-grid {
    grid-template-columns: 1fr 1fr;
  }
}
@media (max-width: 600px) {
  .feature-grid {
    grid-template-columns: 1fr;
  }
}
.chat-bubble {
  background: #DCF8C6;
  border-radius: 10px 10px 10px 2px;
  padding: 9px 12px;
  font-size: 0.78rem;
  color: #1c1c1c;
  max-width: 90%;
  margin-bottom: 6px;
}
.chat-bubble.out {
  background: var(--white);
  border-radius: 10px 10px 2px 10px;
  margin-left: auto;
  border: 1px solid var(--line);
}
.chat-time {
  font-size: 0.62rem;
  color: var(--ink-soft);
  text-align: right;
  margin-top: 2px;
}
.match-mini {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}
.match-mini:last-child {
  border-bottom: none;
}
.match-mini-name {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--heading-text);
}
.match-mini-pct {
  font-family: "Baloo 2";
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--green);
}
.verify-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.8rem;
  color: var(--ink-soft);
  padding: 5px 0;
}
.verify-row svg {
  width: 14px;
  height: 14px;
  stroke: var(--green);
  flex-shrink: 0;
}
.stat-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  text-align: center;
}
.stat-strip strong {
  display: block;
  font-family: "Baloo 2";
  font-size: 2rem;
  color: var(--saffron);
}
.stat-strip span {
  font-size: 0.82rem;
  color: #B7C7D2;
}
@media (max-width: 700px) {
  .stat-strip {
    grid-template-columns: 1fr 1fr;
  }
}
.path-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
.path-card {
  border-radius: var(--radius-lg);
  padding: 34px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.path-card.owner {
  background: var(--navy-dark);
  color: var(--white);
}
.path-card.seeker {
  background: var(--saffron);
  color: var(--heading-text);
}
.path-card h3 {
  font-size: 1.4rem;
}
.path-card.owner h3 {
  color: var(--white);
}
.path-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.path-list li {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  font-size: 0.9rem;
}
.path-list svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  margin-top: 3px;
}
.path-card.owner svg {
  stroke: var(--saffron);
}
.path-card.seeker svg {
  stroke: var(--navy-dark);
}
@media (max-width: 800px) {
  .path-grid {
    grid-template-columns: 1fr;
  }
}
.scale-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  align-items: center;
}
.scale-list {
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.scale-item {
  display: flex;
  gap: 14px;
  align-items: flex-start;
}
.scale-item-icon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: #E9F1F7;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.scale-item-icon svg {
  width: 18px;
  height: 18px;
  stroke: var(--navy);
}
.scale-item h4 {
  font-size: 0.95rem;
  margin-bottom: 3px;
}
.scale-item p {
  font-size: 0.86rem;
  color: var(--ink-soft);
}
.scale-visual {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 26px;
}
.india-bar-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.india-bar-label {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--ink-soft);
  width: 90px;
  flex-shrink: 0;
}
.india-bar-track {
  flex: 1;
  height: 10px;
  background: var(--cream);
  border-radius: 6px;
  overflow: hidden;
}
.india-bar-fill {
  height: 100%;
  border-radius: 6px;
  background: var(--saffron);
}
.india-bar-val {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--heading-text);
  width: 50px;
  text-align: right;
  flex-shrink: 0;
}
@media (max-width: 800px) {
  .scale-grid {
    grid-template-columns: 1fr;
  }
}
.story-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
.story-card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.story-quote {
  font-size: 0.95rem;
  color: var(--ink);
  line-height: 1.6;
}
.story-quote::before {
  content: "\201c";
  color: var(--saffron-dark);
  font-size: 1.5rem;
  font-family: "Baloo 2";
  margin-right: 2px;
}
.story-who {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: auto;
}
.story-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--navy);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Baloo 2";
  font-weight: 700;
  font-size: 0.85rem;
}
.story-name {
  font-weight: 700;
  font-size: 0.87rem;
}
.story-role {
  font-size: 0.76rem;
  color: var(--ink-soft);
}
@media (max-width: 900px) {
  .story-grid {
    grid-template-columns: 1fr;
  }
}
.final-cta {
  background: var(--saffron);
  border-radius: var(--radius-lg);
  padding: 52px 44px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
}
.final-cta h3 {
  font-size: clamp(1.5rem, 2.6vw, 2rem);
  color: var(--heading-text);
  max-width: 480px;
}
footer {
  background: var(--navy-dark);
  color: #B7C7D2;
  padding-top: 56px;
}
.footer-grid {
  display: grid;
  grid-template-columns: 1.4fr repeat(3, 1fr);
  gap: 32px;
  padding-bottom: 40px;
}
.footer-brand {
  color: var(--white);
  font-family: "Baloo 2";
  font-weight: 800;
  font-size: 1.25rem;
  margin-bottom: 12px;
}
.footer-desc {
  font-size: 0.86rem;
  line-height: 1.6;
  max-width: 280px;
}
.footer-col h5 {
  color: var(--white);
  font-size: 0.83rem;
  margin-bottom: 16px;
}
.footer-col ul li {
  margin-bottom: 10px;
}
.footer-col a {
  font-size: 0.86rem;
}
.footer-col a:hover {
  color: var(--white);
}
.footer-bottom {
  border-top: 1px solid rgba(255, 255, 255, 0.12);
  padding: 20px 0;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 0.8rem;
}
#ownerFlowSection {
  display: none;
  background: var(--cream);
  min-height: 70vh;
}
.flow-wrap {
  max-width: 820px;
  margin: 0 auto;
  padding: 40px 24px 90px;
}
.flow-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  font-size: 0.88rem;
  color: var(--navy);
  margin-bottom: 24px;
}
.flow-back svg {
  width: 16px;
  height: 16px;
}
.flow-progress {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 34px;
}
.flow-progress-step {
  display: flex;
  align-items: center;
  gap: 8px;
}
.flow-progress-dot {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--line);
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.78rem;
  font-weight: 700;
  flex-shrink: 0;
}
.flow-progress-dot.active {
  background: var(--saffron);
  color: var(--heading-text);
}
.flow-progress-dot.done {
  background: var(--green);
  color: #fff;
}
.flow-progress-label {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--ink-soft);
}
.flow-progress-label.active {
  color: var(--heading-text);
}
.flow-progress-line {
  width: 36px;
  height: 2px;
  background: var(--line);
}
@media (max-width: 600px) {
  .flow-progress-label {
    display: none;
  }
}
.flow-panel {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 28px;
  margin-bottom: 20px;
}
.flow-panel h3 {
  font-size: 1.1rem;
  margin-bottom: 4px;
}
.flow-panel .flow-panel-sub {
  font-size: 0.85rem;
  color: var(--ink-soft);
  margin-bottom: 22px;
}
.flow-form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.flow-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.flow-field.full {
  grid-column: 1/-1;
}
.flow-field label {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--heading-text);
}
.flow-field input,
.flow-field select,
.flow-field textarea {
  border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 11px 13px;
  font-size: 0.9rem;
  width: 100%;
  background: var(--cream);
  font-family: "Inter", sans-serif;
}
.flow-field input:focus,
.flow-field select:focus,
.flow-field textarea:focus {
  outline: none;
  border-color: var(--saffron);
  background: var(--white);
}
.flow-check-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.flow-check-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  padding: 9px 15px;
  font-size: 0.83rem;
  font-weight: 600;
  color: var(--ink-soft);
  cursor: pointer;
}
.flow-check-pill input {
  accent-color: var(--saffron);
}
.flow-check-pill:has(input:checked) {
  border-color: var(--saffron);
  background: #FFF3E4;
  color: var(--saffron-dark);
}
.flow-section-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 22px 0 14px;
}
.flow-section-divider h4 {
  font-size: 0.92rem;
  color: var(--navy);
  white-space: nowrap;
}
.flow-section-divider .fline {
  height: 1px;
  background: var(--line);
  flex: 1;
}
.flow-form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 24px;
}
@media (max-width: 700px) {
  .flow-form-grid {
    grid-template-columns: 1fr;
  }
}
.flow-job-summary {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 18px 22px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}
.flow-job-summary-icon {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  background: #FFF3E4;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.flow-job-summary-icon svg {
  width: 20px;
  height: 20px;
  stroke: var(--saffron);
}
.flow-job-summary-title {
  font-weight: 700;
  font-size: 1rem;
  color: var(--heading-text);
}
.flow-job-summary-sub {
  font-size: 0.82rem;
  color: var(--ink-soft);
  margin-top: 2px;
}
.flow-job-summary-badge {
  margin-left: auto;
  background: #EAF7E9;
  color: var(--green);
  font-size: 0.72rem;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 999px;
  white-space: nowrap;
}
.flow-match-card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 22px;
  margin-bottom: 16px;
}
.flow-match-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.flow-match-avatar-row {
  display: flex;
  gap: 14px;
  align-items: center;
}
.flow-match-avatar {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: var(--navy);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Baloo 2";
  font-weight: 700;
  flex-shrink: 0;
}
.flow-match-name {
  font-weight: 700;
  font-size: 1rem;
  color: var(--heading-text);
}
.flow-match-meta {
  font-size: 0.8rem;
  color: var(--ink-soft);
  margin-top: 2px;
}
.flow-match-pct {
  font-family: "Baloo 2";
  font-size: 1.5rem;
  font-weight: 700;
}
.flow-match-pct-label {
  font-size: 0.68rem;
  color: var(--ink-soft);
  text-align: right;
}
.flow-factor-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}
.flow-factor-tag {
  font-size: 0.74rem;
  font-weight: 600;
  background: var(--cream);
  border: 1px solid var(--line);
  padding: 5px 11px;
  border-radius: 999px;
  color: var(--ink-soft);
}
.flow-stage-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.flow-stage-pill {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 6px 13px;
  border-radius: 999px;
}
.flow-stage-Applied {
  background: #E9F1F7;
  color: var(--navy);
}
.flow-stage-Shortlisted {
  background: #F1E7F6;
  color: var(--purple);
}
.flow-stage-Interview {
  background: #FDF3D9;
  color: #E6A100;
}
.flow-stage-InterviewScheduled {
  background: #FDF3D9;
  color: #E6A100;
}
.flow-stage-Hired {
  background: #EAF7E9;
  color: var(--green);
}
.flow-stage-Rejected {
  background: #FBE4E4;
  color: var(--red);
}
.flow-action-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.flow-chip-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px 14px;
  border-radius: 8px;
  font-size: 0.8rem;
  font-weight: 700;
  border: 1px solid var(--line);
  background: var(--white);
  color: var(--ink-soft);
  cursor: pointer;
  font-family: "Inter", sans-serif;
}
.flow-chip-btn svg {
  width: 14px;
  height: 14px;
}
.flow-chip-btn.call:hover {
  border-color: var(--green);
  color: var(--green);
}
.flow-chip-btn.whatsapp:hover {
  border-color: #25D366;
  color: #1FAE55;
}
.flow-chip-btn.hired {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
}
.flow-chip-btn.reject:hover {
  border-color: var(--red);
  color: var(--red);
}
.flow-chip-btn.rejected {
  background: var(--red);
  color: #fff;
  border-color: var(--red);
}
.flow-toast {
  position: fixed;
  bottom: 26px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--navy-dark);
  color: #fff;
  padding: 13px 20px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 600;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
  opacity: 0;
  transition: opacity .25s ease, transform .25s ease;
  z-index: 999;
  display: flex;
  align-items: center;
  gap: 10px;
}
.flow-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.flow-toast svg {
  width: 15px;
  height: 15px;
  stroke: var(--green);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: "Inter", sans-serif;
  color: var(--ink);
  background: var(--cream);
  line-height: 1.5;
}
h1,
h2,
h3,
h4 {
  font-family: "Baloo 2", sans-serif;
  margin: 0;
  color: var(--heading-text);
  font-weight: 700;
}
p {
  margin: 0;
}
a {
  text-decoration: none;
  color: inherit;
}
ul {
  list-style: none;
  margin: 0;
  padding: 0;
}
button,
input,
select,
textarea {
  font-family: inherit;
}
button {
  cursor: pointer;
}
svg {
  display: block;
  flex-shrink: 0;
}
:focus-visible {
  outline: 3px solid var(--saffron);
  outline-offset: 2px;
}
img {
  max-width: 100%;
  display: block;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 11px 20px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.87rem;
  border: none;
  transition: transform .12s ease;
  white-space: nowrap;
}
.btn:active {
  transform: scale(0.97);
}
.btn-primary {
  background: var(--saffron);
  color: var(--heading-text);
}
.btn-primary:hover {
  background: var(--saffron-dark);
}
.btn-outline {
  background: transparent;
  color: var(--navy);
  border: 1.5px solid var(--navy);
}
.btn-outline:hover {
  background: var(--navy);
  color: #fff;
}
.btn-block {
  width: 100%;
}
.btn-sm {
  padding: 8px 14px;
  font-size: 0.78rem;
}
.jf-topbar {
  position: sticky;
  top: 0;
  z-index: 80;
  background: var(--white);
  border-bottom: 1px solid var(--line);
}
.jf-brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  max-width: 1000px;
  margin: 0 auto;
}
.jf-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: "Baloo 2";
  font-weight: 800;
  font-size: 1.45rem;
  color: var(--heading-text);
}
.jf-brand span {
  color: var(--saffron);
}
.jf-topbar-actions {
  display: flex;
  gap: 14px;
  align-items: center;
}
.jf-icon-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--cream);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.jf-icon-btn svg {
  width: 21px;
  height: 21px;
  stroke: var(--navy);
}
.jf-count-dot {
  position: absolute;
  top: -3px;
  right: -3px;
  background: var(--red);
  color: #fff;
  font-size: 0.65rem;
  font-weight: 700;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.jf-search-row {
  display: flex;
  gap: 10px;
  padding: 0 20px 12px;
  align-items: center;
  max-width: 1180px;
  margin: 0 auto;
  box-sizing: border-box;
}
.jf-search-bar {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--cream);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-md);
  padding: 11px 15px;
}
.jf-search-bar svg {
  width: 18px;
  height: 18px;
  stroke: var(--ink-soft);
  flex-shrink: 0;
}
.jf-search-bar input {
  border: none;
  background: none;
  width: 100%;
  font-size: 0.92rem;
}
.jf-search-bar input:focus {
  outline: none;
}
.jf-mic-btn {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.jf-mic-btn svg {
  width: 12px;
  height: 12px;
  stroke: var(--saffron-dark);
}
.jf-gps-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--navy);
  background: #E9F1F7;
  padding: 11px 14px;
  border-radius: 999px;
  white-space: nowrap;
  flex-shrink: 0;
}
.jf-gps-btn svg {
  width: 14px;
  height: 14px;
}
.jf-location-banner {
  margin: 0 auto 12px;
  max-width: 1140px;
  padding: 0 20px;
  font-size: 0.82rem;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  box-sizing: border-box;
}
.jf-location-banner strong {
  color: var(--heading-text);
}
.jf-location-banner svg {
  width: 14px;
  height: 14px;
  stroke: var(--green);
}
.jf-toolbar {
  display: flex;
  gap: 8px;
  padding: 0 20px 14px;
  overflow-x: auto;
  max-width: 1180px;
  margin: 0 auto;
  box-sizing: border-box;
}
.jf-toolbar::-webkit-scrollbar {
  display: none;
}
.jf-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px 15px;
  border-radius: 999px;
  border: 1.5px solid var(--line);
  background: var(--white);
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--ink-soft);
  white-space: nowrap;
  flex-shrink: 0;
}
.jf-chip.active {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}
.jf-chip.urgent.active {
  background: var(--red);
  border-color: var(--red);
}
.jf-chip.verified.active {
  background: var(--green);
  border-color: var(--green);
}
.jf-chip svg {
  width: 13px;
  height: 13px;
}
.jf-content {
  max-width: 1180px;
  margin: 0 auto;
  padding: 18px 20px 100px;
}
.jf-jobid-banner {
  background: var(--navy-dark);
  border-radius: var(--radius-md);
  padding: 18px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 22px;
  color: #fff;
}
.jf-jobid-banner-text {
  font-size: 0.88rem;
  color: #C9D8E2;
}
.jf-jobid-banner-text strong {
  color: #fff;
  display: block;
  font-family: "Baloo 2";
  font-size: 1rem;
  margin-bottom: 2px;
}
.jf-section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.jf-section-title h3 {
  font-size: 1.05rem;
}
.jf-reco-scroll {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 26px;
}
.jf-reco-scroll::-webkit-scrollbar {
  display: none;
}
.jf-reco-card {
  min-width: 230px;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 16px;
  cursor: pointer;
  flex-shrink: 0;
}
.jf-reco-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}
.jf-reco-pct {
  font-family: "Baloo 2";
  font-weight: 700;
  font-size: 1rem;
  color: var(--green);
}
.jf-reco-title {
  font-weight: 700;
  font-size: 0.88rem;
  color: var(--heading-text);
}
.jf-reco-shop {
  font-size: 0.76rem;
  color: var(--ink-soft);
  margin: 2px 0 8px;
}
.jf-reco-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.jf-reco-tag {
  font-size: 0.65rem;
  font-weight: 600;
  background: var(--cream);
  padding: 3px 8px;
  border-radius: 999px;
  color: var(--ink-soft);
}
.jf-results-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 10px;
}
.jf-results-count {
  font-size: 0.88rem;
  color: var(--ink-soft);
}
.jf-results-count strong {
  color: var(--heading-text);
}
.jf-view-toggle {
  display: flex;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
}
.jf-view-btn {
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: 5px;
}
.jf-view-btn.active {
  background: var(--navy);
  color: #fff;
}
.jf-view-btn svg {
  width: 13px;
  height: 13px;

.japp-foot-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  flex-wrap: wrap;
  gap: 10px;
}
@media (max-width: 600px) {
  .japp-step-label {
    font-size: 0.58rem;
  }
}
.auth-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 20, 28, 0.55);
  z-index: 400;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.auth-overlay.show {
  display: flex;
}
.auth-modal {
  background: var(--white);
  border-radius: var(--radius-lg);
  max-width: 400px;
  width: 100%;
  overflow: hidden;
  box-shadow: 0 30px 70px rgba(0, 0, 0, 0.35);
  position: relative;
}
.auth-modal-inner {
  padding: 32px;
}
.auth-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--cream);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}
.auth-close svg {
  width: 14px;
  height: 14px;
  stroke: var(--ink-soft);
}
.auth-badge {
  display: inline-block;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 4px 11px;
  border-radius: 999px;
  margin-bottom: 14px;
}
.auth-badge.owner {
  background: #E9F1F7;
  color: var(--navy);
}
.auth-badge.seeker {
  background: #FFF3E4;
  color: var(--saffron-dark);
}
.role-choice-card {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: left;
  padding: 18px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--white);
  margin-bottom: 14px;
}
.role-choice-card:hover {
  border-color: var(--saffron);
  background: var(--cream);
}
.role-choice-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.role-choice-icon svg {
  width: 20px;
  height: 20px;
}
.role-choice-title {
  font-weight: 700;
  color: var(--heading-text);
  font-size: 0.95rem;
}
.role-choice-sub {
  font-size: 0.8rem;
  color: var(--ink-soft);
  margin-top: 2px;
}
.auth-tab-row {
  display: flex;
  background: var(--cream);
  border-radius: 999px;
  padding: 4px;
  margin-bottom: 20px;
}
.auth-tab-btn {
  flex: 1;
  padding: 9px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.83rem;
  color: var(--ink-soft);
  border: none;
  background: none;
  cursor: pointer;
  font-family: inherit;
}
.auth-tab-btn.active {
  background: var(--navy);
  color: #fff;
}
.auth-modal-lg {
  max-width: 640px;
}
.auth-modal-lg .auth-modal-inner {
  max-height: 82vh;
  overflow-y: auto;
}
.signup-upload-box {
  display: block;
  border: 2px dashed var(--line);
  border-radius: var(--radius-sm);
  padding: 14px 10px;
  text-align: center;
  color: var(--ink-soft);
  font-size: 0.82rem;
  background: var(--cream);
  cursor: pointer;
}
.signup-upload-box:hover {
  border-color: var(--saffron);
}
.auth-modal h3 {
  font-size: 1.15rem;
  margin-bottom: 6px;
}
.auth-sub {
  font-size: 0.85rem;
  color: var(--ink-soft);
  margin-bottom: 22px;
}
.auth-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}
.auth-field label {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--ink-soft);
}
.auth-field input[type=text] {
  border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px 13px;
  font-size: 0.92rem;
  width: 100%;
  background: var(--cream);
}
.auth-field input:focus {
  outline: none;
  border-color: var(--saffron);
  background: var(--white);
}
.auth-mobile-row {
  display: flex;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--cream);
}
.auth-mobile-row span {
  padding: 12px;
  font-weight: 600;
  color: var(--ink-soft);
  border-right: 1px solid var(--line);
}
.auth-mobile-row input {
  border: none;
  background: none;
  padding: 12px 13px;
  width: 100%;
  font-size: 0.92rem;
}
.auth-mobile-row input:focus {
  outline: none;
}
.auth-otp-row {
  display: flex;
  gap: 8px;
  margin: 14px 0 6px;
}
.auth-otp-box {
  width: 100%;
  height: 52px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  text-align: center;
  font-size: 1.2rem;
  font-family: "Baloo 2";
  font-weight: 700;
  color: var(--heading-text);
}
.auth-otp-box:focus {
  outline: none;
  border-color: var(--saffron);
}
.auth-alt {
  text-align: center;
  font-size: 0.8rem;
  color: var(--ink-soft);
  margin-top: 16px;
}
.auth-alt a {
  color: var(--navy);
  font-weight: 600;
}

</style>
